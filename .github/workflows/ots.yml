name: ots

# OpenTimestamps for a signed manifest, on a Linux runner (the client does not run on Windows Python).
# mode=stamp   : stamps docs/<manifest> -> uploads the pending .ots as a workflow artifact
# mode=upgrade : upgrades the committed docs/<manifest>.ots once a Bitcoin block includes it -> artifact
# manifest     : MANIFEST_v1.0.md (Pagouro BE 1.0, default) or MANIFEST_styles-1.0.md (the Styles pack)
# The session downloads the artifact and commits it; nothing is pushed by the runner.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: stamp or upgrade
        required: true
        default: stamp
      manifest:
        description: manifest file name under docs/
        required: false
        default: MANIFEST_v1.0.md

jobs:
  ots:
    runs-on: ubuntu-latest
    env:
      M: docs/${{ github.event.inputs.manifest || 'MANIFEST_v1.0.md' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q opentimestamps-client && ots --version
      - name: Verify the signature first
        run: |
          sudo apt-get install -y -qq minisign >/dev/null
          minisign -Vm "$M" -p docs/pagouro.pub
          sha256sum "$M"
      - name: Stamp
        if: ${{ github.event.inputs.mode == 'stamp' }}
        run: |
          rm -f "$M.ots"
          ots stamp "$M"
          ots info "$M.ots" | head -20
      - name: Upgrade
        if: ${{ github.event.inputs.mode == 'upgrade' }}
        run: |
          ots upgrade "$M.ots" || true
          ots info "$M.ots" | tail -5
          ots --no-bitcoin verify "$M.ots" || true
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-ots-${{ github.event.inputs.mode }}
          path: ${{ env.M }}.ots
          if-no-files-found: error
